name: Automated README Synchronization

'on':
  schedule:
    # 23:00 Vietnam time (UTC+7) corresponds to 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '[0-9]*/**'
      - 'scripts/**'

concurrency:
  group: update-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synchronize-readme:
    name: Synchronize README.md
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute README updater
        run: |
          python scripts/update_readme.py

      - name: Commit and push changes if README.md updated
        run: |
          if git diff --quiet README.md; then
            echo "README.md is already up to date. No commit necessary."
            exit 0
          fi

          echo "Synchronized changes detected in README.md. Committing..."
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: automatically synchronize README statistics"
          git push origin ${{ github.ref_name }}
