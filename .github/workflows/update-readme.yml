name: Immediate README Synchronization

'on':
  push:
    branches:
      - main
    paths:
      - '[0-9]*/*.cpp'
      - '[0-9]*/*.cc'
      - '[0-9]*/*.cxx'
      - '[0-9]*/*.py'
      - '[0-9]*/*.c'
      - '[0-9]*/*.java'
      - '[0-9]*/*.rs'
      - '[0-9]*/*.go'
      - '[0-9]*/*.kt'
      - '[0-9]*/*.cs'
      - '[0-9]*/**/*.cpp'
      - '[0-9]*/**/*.cc'
      - '[0-9]*/**/*.cxx'
      - '[0-9]*/**/*.py'
      - '[0-9]*/**/*.c'
      - '[0-9]*/**/*.java'
      - '[0-9]*/**/*.rs'
      - '[0-9]*/**/*.go'
      - '[0-9]*/**/*.kt'
      - '[0-9]*/**/*.cs'
  workflow_dispatch:

concurrency:
  group: update-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synchronize-readme:
    name: Synchronize README.md
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute README updater
        run: |
          python scripts/update_readme.py

      - name: Validate generated README content
        run: |
          python scripts/update_readme.py --check

      - name: Commit and push changes if README.md updated
        run: |
          if git diff --quiet README.md; then
            echo "README.md is already up to date. No commit necessary."
            exit 0
          fi

          echo "Synchronized changes detected in README.md."
          
          # Rebase on latest remote branch state before committing to avoid conflicts
          git pull --rebase origin main || true

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: automatically update README after new solutions"
          git push origin main
